<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Kivo Workspace - Edge Intelligence Platform">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kivo Workspace">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Kivo Workspace</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #0D0E12;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    #kivo-splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 40%, #161822 0%, #0D0E12 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .kivo-logo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      width: 46px;
      height: 46px;
      margin-bottom: 24px;
      animation: kivo-pulse 2s infinite ease-in-out;
    }
    .kivo-logo-sq {
      background: linear-gradient(135deg, #00CBA9, #6366F1);
      border-radius: 5px;
    }
    @keyframes kivo-pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 16px rgba(0, 203, 169, 0.45)); }
    }
    .kivo-title {
      color: #FFFFFF;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 4px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .kivo-subtitle {
      color: #8E8E93;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 1px;
      margin-bottom: 40px;
    }
    .kivo-loader-bar {
      width: 180px;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }
    .kivo-loader-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #00CBA9, #6366F1);
      border-radius: 3px;
      animation: kivo-slide 1.5s infinite ease-in-out;
    }
    @keyframes kivo-slide {
      0% { left: -40%; width: 30%; }
      50% { width: 60%; }
      100% { left: 110%; width: 30%; }
    }
    .kivo-loading-text {
      margin-top: 16px;
      color: #636366;
      font-size: 12px;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div id="kivo-splash-screen">
    <div class="kivo-logo-grid">
      <div class="kivo-logo-sq"></div>
      <div class="kivo-logo-sq"></div>
      <div class="kivo-logo-sq"></div>
      <div class="kivo-logo-sq"></div>
    </div>
    <div class="kivo-title">KIVO WORKSPACE</div>
    <div class="kivo-subtitle">Edge Intelligence Platform</div>
    <div class="kivo-loader-bar">
      <div class="kivo-loader-fill"></div>
    </div>
    <div class="kivo-loading-text">Initializing AI Engine & Workspace UI...</div>
  </div>

  <script>
    (function() {
      if (window.location.hostname.indexOf('ngrok') !== -1) {
        try {
          document.cookie = "ngrok-skip-browser-warning=true; path=/; max-age=31536000";
        } catch(e) {}
      }

      function dismissSplash() {
        var splash = document.getElementById('kivo-splash-screen');
        if (splash && splash.style.opacity !== '0') {
          splash.style.opacity = '0';
          setTimeout(function() {
            if (splash && splash.parentNode) {
              splash.parentNode.removeChild(splash);
            }
          }, 500);
        }
      }

      var attempts = 0;
      var interval = setInterval(function() {
        attempts++;
        var flutterReady = document.querySelector('flutter-view') || 
                            document.querySelector('flt-glass-pane') || 
                            (document.body && document.body.children.length > 2);
        if (flutterReady || attempts > 100) {
          dismissSplash();
          clearInterval(interval);
        }
      }, 100);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
